name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O Android SDK já vem no ubuntu-latest; só aceitamos as licenças
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Mantém a pasta www (raiz) e o app Android sempre iguais
      - name: Sincronizar www -> assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www

      - name: Gerar APK debug
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Gerar APK release
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          gradle assembleRelease --stacktrace

      - name: Renomear APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/jarvis-debug.apk
          cp android/app/build/outputs/apk/release/*.apk dist/jarvis-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: dist/*.apk

